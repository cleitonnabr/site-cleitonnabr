
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Uma mensagem especial</title>
  <style>
    body {
      margin: 0;
      background: #fff;
      font-family: Arial, sans-serif;
      color: #333;
      text-align: center;
    }
    header {
      padding: 22px;
      border-bottom: 1px solid #eee;
      font-size: 18px;
      font-weight: bold;
    }
    main {
      max-width: 450px;
      margin: 70px auto;
      padding: 20px;
    }
    h1 { font-size: 23px; }
    p { line-height: 1.6; }
    audio {
      width: 100%;
      margin-top: 25px;
    }
    footer {
      margin-top: 70px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>Foto & Cia Santana</header>

  <main>
    <h1>Uma mensagem especial para você!</h1>
    <p>Aperte o play e ouça sua mensagem.</p>

    <audio controls preload="metadata">
      <source src="demonstracao.mp3" type="audio/mpeg">
      Seu navegador não suporta áudio.
    </audio>

    <footer>
      Uma lembrança que ganha voz.
    </footer>
  </main>
</body>
</html>
